checked:
  note: scripts/02_verify.py, before upload
  items:
    - every zip against MANIFEST.json (size and sha256), read to the end with zipfile.testzip
    - every layer in the zip the manifest assigns it to
    - feature counts equal in .dbf, .shx and Parquet for all 215 layers; no deleted .dbf records
    - columns are the .dbf fields in order, then geometry; types as the .dbf definitions give
    - all 11,756,311 attribute cells equal an independent Python reading of the .dbf
    - every geometry's WKB equals GDAL's reading of the .shp
    - GeoParquet 'geo' metadata names EPSG:4326 (the all-null layer carries it in the Parquet GEOMETRY logical type)
    - invalid, null and empty geometries counted, not fixed

modifications:
  raw: none. The publisher's zips, byte for byte.
  parquet:
    - one file per layer; all .dbf fields kept, in order, under their names
    - types from the .dbf field definitions (C VARCHAR; N without decimals INTEGER up to width 9, BIGINT up to 18; N with decimals and F DOUBLE; L BOOLEAN; D DATE)
    - text decoded per .cpg (UTF-8, 178 layers); 37 layers have no .cpg, LDID 0, and every text value is valid UTF-8, so they are read as UTF-8
    - text as GDAL reads it - cut at the first NUL (69 layers pad with NULs) and trimmed of leading and trailing spaces (6 values in ne_10m_rivers_lake_centerlines_scale_rank had a leading space); empty text, numbers and dates NULL
    - geometry unchanged, typed GEOMETRY('EPSG:4326') from the .prj (GCS_WGS_1984); ne_10m_admin_0_names has no .prj, and no coordinates either
    - GeoParquet 1.0 metadata, zstd, no bloom filters; key-value metadata natural_earth_layer, natural_earth_version, source_url, source_sha256

