  publisher: Natural Earth (naturalearthdata.com)
  distribution: https://naciscdn.org/naturalearth/<scale>/<category>/<layer>.zip
  layer_list:
    from: GitHub tree of nvkelso/natural-earth-vector at its latest release tag, read through the public API
    api: https://api.github.com/repos/nvkelso/natural-earth-vector/git/trees/v5.1.2?recursive=1
    release: v5.1.2
    release_published_at: 2022-05-13T23:24:34Z
    commit: f1890d9f152c896d250a77557a5751a93d494776
    rule: every .shp under 10m_cultural, 10m_physical, 50m_cultural, 50m_physical, 110m_cultural, 110m_physical
    layers: 215
    note: the master branch tree had the same 215 .shp paths on 2026-10-06
  download_pages:
    - https://www.naturalearthdata.com/downloads/10m-cultural-vectors/
    - https://www.naturalearthdata.com/downloads/10m-physical-vectors/
    - https://www.naturalearthdata.com/downloads/50m-cultural-vectors/
    - https://www.naturalearthdata.com/downloads/50m-physical-vectors/
    - https://www.naturalearthdata.com/downloads/110m-cultural-vectors/
    - https://www.naturalearthdata.com/downloads/110m-physical-vectors/
  fetched: 2026-10-06
  licence:
    applied: public domain (https://www.naturalearthdata.com/about/terms-of-use/, read 2026-10-06)
    card: "license: other, license_name: public-domain"
    quote: >-
      All versions of Natural Earth raster + vector map data found on this
      website are in the public domain. You may use the maps in any manner,
      including modifying the content and design, electronic dissemination,
      and offset printing. [...] No permission is needed to use Natural
      Earth. Crediting the authors is unnecessary.
    third_party_credits_on_that_page:
      - The Washington Post (non-exclusive licence to Natural Earth, for creating a world base map)
      - European Commission JRC Institute for Environment and Sustainability (river and lake data, Europe only)
      - XNR Productions (road transportation data, North America only)
      - International Mapping Associates, Inc. (time zone data)
      - Wikidata (names in more than 20 languages, CC0)
    note: |
      The four providers granted Natural Earth a non-exclusive licence "for
      the sole purpose of creating a world base map". Natural Earth
      distributes all its data as public domain; the page does not say how
      far that covers the parts derived from them.

