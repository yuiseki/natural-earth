[project]
name = "natural-earth"
version = "0.1.0"
description = "Reproducible collection of natural-earth"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "huggingface-hub>=1.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
